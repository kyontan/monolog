# Decap CMS config. Before use:
#  1. deploy decap-proxy and set base_url below to its workers.dev URL
#  2. decide media hosting: media_folder below commits into the repo, but the
#     converted articles reference absolute R2 URLs. Align when ready.
backend:
  name: github
  base_url: https://monolog-decap-proxy.monora.workers.dev
  auth_endpoint: /auth
  repo: kyontan/monolog
  branch: main

# Prevent Decap from publishing directly; use editorial workflow PRs.
publish_mode: editorial_workflow
# Images upload to R2 via monolog-uploader (see /uploader, static/admin/r2-library.js).
media_library:
  name: r2
  config:
    endpoint: https://monolog-uploader.monora.workers.dev
# Fallback when the custom library is unavailable.
media_folder: "src/img"
public_folder: "/img"

collections:
  - name: "posts"
    label: "Posts"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Slug", name: "slug", widget: "string" }
      - label: "Categories (slugs derive automatically)"
        name: "categories"
        required: false
        widget: "relation"
        collection: "taxonomies"
        file: "terms"
        search_fields: ["categories.*"]
        value_field: "categories.*"
        multiple: true
      - label: "Tags (slugs derive automatically)"
        name: "post_tags"
        required: false
        widget: "relation"
        collection: "taxonomies"
        file: "terms"
        search_fields: ["tags.*"]
        value_field: "tags.*"
        multiple: true
      - label: "New categories (one per line, added to candidates on merge)"
        name: "new_categories"
        required: false
        widget: "list"
        field: { label: "Category", name: "category", widget: "string" }
      - label: "New tags (one per line, added to candidates on merge)"
        name: "new_tags"
        required: false
        widget: "list"
        field: { label: "Tag", name: "tag", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "pages"
    label: "Pages"
    files:
      - label: "About"
        name: "about"
        file: "src/pages/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
  - name: "taxonomies"
    label: "Taxonomies"
    files:
      - label: "Terms"
        name: "terms"
        file: "src/taxonomies.yml"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            field: { label: "Category", name: "category", widget: "string" }
          - label: "Tags"
            name: "tags"
            widget: "list"
            field: { label: "Tag", name: "tag", widget: "string" }
