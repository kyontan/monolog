#:schema node_modules/wrangler/config-schema.json

name = "monolog-uploader"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "monora-monolog-media"

[vars]
# Public base URL for inserted image URLs (r2.dev for now; custom domain later).
PUBLIC_BASE_URL = "https://pub-ceba25df58934fa492f19ecc3b50020e.r2.dev"
# Only this GitHub user may upload (validated against the Bearer token).
ALLOWED_GITHUB_USER = "kyontan"
# Comma-separated origins allowed to call the API (Decap admin page).
ALLOWED_ORIGINS = "https://blog.monora.me"
